services:
  pronunciation:
    build:
      context: ./services/PronounceAI/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - pronounce_hf_cache:/root/.cache/huggingface

volumes:
  pronounce_hf_cache:
